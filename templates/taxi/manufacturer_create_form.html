{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h2>{{ object|yesno:"Update,Create"}} Manufacturer</h2>
  <form action="" novalidate method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit">Save</button>
    {% if object %}
      <a href="{% url "taxi:manufacturer-list" %}">Cancel</a>
    {% endif %}
  </form>
{% endblock %}
